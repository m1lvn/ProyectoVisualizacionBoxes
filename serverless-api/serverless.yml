service: hospital-boxes-api
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    DYNAMODB_TABLE: HospitalData
    STAGE: ${self:custom.stage}
    USER_POOL_ID: !Ref HospitalUserPool
    USER_POOL_CLIENT_ID: !Ref HospitalUserPoolClient
  # Usar rol existente de AWS Academy en lugar de crear uno nuevo
  role: arn:aws:iam::891377117593:role/LabRole
  logs:
    httpApi: true
  httpApi:
    authorizers:
      cognitoJwt:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl:
          Fn::Sub:
            - https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}
            - { UserPoolId: { Ref: HospitalUserPool } }
        audience:
          - { Ref: HospitalUserPoolClient }

custom:
  stage: ${opt:stage, self:provider.stage, 'dev'}
  serverless-offline:
    httpPort: 3001
    host: 0.0.0.0

plugins:
  - serverless-offline

functions:
  # Endpoints de Autenticación
  login:
    handler: src/handlers/auth.login
    events:
      - httpApi:
          method: POST
          path: /auth/login
          
  refresh:
    handler: src/handlers/auth.refresh
    events:
      - httpApi:
          method: POST
          path: /auth/refresh
          
  me:
    handler: src/handlers/auth.me
    events:
      - httpApi:
          method: GET
          path: /me
          authorizer:
            name: cognitoJwt
  
  # JWT Authorizer (mantenemos para casos avanzados)
  jwtAuthorizer:
    handler: src/middleware/jwtAuth.authorize
    
  # Obtener boxes por pasillo
  getBoxes:
    handler: src/handlers/boxes.getBoxes
    events:
      - http:
          path: /api/boxes
          method: get
          cors: true
  
  # Obtener agendas
  getAgendas:
    handler: src/handlers/agendas.getAgendas
    events:
      - http:
          path: /api/agendas
          method: get
          cors: true
          
  # Crear agenda
  createAgenda:
    handler: src/handlers/agendas.createAgenda
    events:
      - http:
          path: /api/agendas
          method: post
          cors: true

  # Obtener pasillos
  getPasillos:
    handler: src/handlers/pasillos.getPasillos
    events:
      - http:
          path: /api/pasillos
          method: get
          cors: true

  # Migrar datos desde MySQL
  migrateData:
    handler: src/handlers/migrate.migrateFromMySQL
    timeout: 300
    events:
      - http:
          path: /api/migrate
          method: post
          cors: true

resources:
  Resources:
    HospitalDataTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: HospitalData
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

    # Cognito User Pool
    HospitalUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: hospital-users-${self:custom.stage}
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
        Schema:
          - Name: email
            AttributeDataType: String
            Required: true
            Mutable: true
          - Name: given_name
            AttributeDataType: String
            Required: true
            Mutable: true
          - Name: family_name
            AttributeDataType: String
            Required: true
            Mutable: true
          - Name: hospital_id
            AttributeDataType: String
            Required: false
            Mutable: true
          - Name: pasillo_asignado
            AttributeDataType: String
            Required: false
            Mutable: true
          - Name: role
            AttributeDataType: String
            Required: false
            Mutable: true
        UsernameAttributes:
          - email
        AdminCreateUserConfig:
          AllowAdminCreateUserOnly: false
          
    # Cognito App Client
    HospitalUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: hospital-web-client-${self:custom.stage}
        UserPoolId: !Ref HospitalUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
          - ALLOW_USER_SRP_AUTH
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        PreventUserExistenceErrors: ENABLED
        TokenValidityUnits:
          AccessToken: minutes
          IdToken: minutes
          RefreshToken: days
        AccessTokenValidity: 30  # 30 minutes
        IdTokenValidity: 30     # 30 minutes  
        RefreshTokenValidity: 30 # 30 days
        
    # Cognito User Pool Groups
    AdminGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: Admin
        Description: "Administrators with full system access and management capabilities"
        UserPoolId: !Ref HospitalUserPool
        Precedence: 1
        
    PersonalGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: Personal
        Description: "Medical and nursing staff with access to assigned corridor only"
        UserPoolId: !Ref HospitalUserPool
        Precedence: 2
        
    PersonalAdministrativoGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: PersonalAdministrativo
        Description: "Administrative staff with booking and reporting access to all corridors"
        UserPoolId: !Ref HospitalUserPool
        Precedence: 3

  Outputs:
    UserPoolId:
      Value: !Ref HospitalUserPool
      Export:
        Name: ${self:custom.stage}-UserPoolId
        
    UserPoolClientId:
      Value: !Ref HospitalUserPoolClient  
      Export:
        Name: ${self:custom.stage}-UserPoolClientId