# Configuración de Experimentos Gremlin
# Para uso con Gremlin CLI o API

experiments:
  
  # ═══════════════════════════════════════════════════════════════
  # EXPERIMENTO #6: CPU STRESS TEST
  # ═══════════════════════════════════════════════════════════════
  
  - id: "exp-06-cpu-stress"
    name: "CPU Stress Test - Lambda getBoxes"
    description: "Consumir 90% CPU en Lambda para validar performance bajo alta carga"
    priority: "HIGH"
    
    target:
      type: "lambda"
      function_name: "hospital-boxes-api-dev-getBoxes"
      region: "us-east-1"
    
    attack:
      type: "cpu"
      parameters:
        percent: 90
        duration: 300  # 5 minutos en segundos
        cores: 1
    
    expected_results:
      - "Incremento en execution time"
      - "Posible throttling si hay concurrencia"
      - "Sin errores fatales"
      - "Recuperación automática post-ataque"
    
    metrics_to_monitor:
      cloudwatch:
        - "Lambda Duration"
        - "Lambda Errors"
        - "Lambda Throttles"
        - "Lambda Concurrent Executions"
      
      thresholds:
        max_duration_ms: 10000
        max_error_rate: 5  # 5%
        max_throttle_count: 10
    
    cli_command: |
      gremlin attack-lambda cpu \
        --function-name hospital-boxes-api-dev-getBoxes \
        --percent 90 \
        --length 300 \
        --region us-east-1 \
        --team-id $GREMLIN_TEAM_ID

  # ═══════════════════════════════════════════════════════════════
  # EXPERIMENTO #7: MEMORY EXHAUSTION
  # ═══════════════════════════════════════════════════════════════
  
  - id: "exp-07-memory-exhaustion"
    name: "Memory Exhaustion - Lambda createAgenda"
    description: "Consumir 95% memoria disponible para probar límites y manejo de OOM"
    priority: "MEDIUM"
    
    target:
      type: "lambda"
      function_name: "hospital-boxes-api-dev-createAgenda"
      region: "us-east-1"
    
    attack:
      type: "memory"
      parameters:
        percent: 95
        duration: 300  # 5 minutos
    
    expected_results:
      - "Incremento en memory usage"
      - "Posibles OOM errors"
      - "Cold starts más lentos"
      - "Lambda puede crashear y reiniciar"
    
    metrics_to_monitor:
      cloudwatch:
        - "Lambda Duration"
        - "Lambda Errors"
        - "Lambda MemorySize"
        - "Lambda MaxMemoryUsed"
      
      thresholds:
        max_memory_used_mb: 512
        max_error_rate: 10  # 10% aceptable para memory exhaustion
        max_duration_ms: 15000
    
    cli_command: |
      gremlin attack-lambda memory \
        --function-name hospital-boxes-api-dev-createAgenda \
        --percent 95 \
        --length 300 \
        --region us-east-1 \
        --team-id $GREMLIN_TEAM_ID

  # ═══════════════════════════════════════════════════════════════
  # EXPERIMENTOS FUTUROS (para próximos meses si hay free tier)
  # ═══════════════════════════════════════════════════════════════
  
  - id: "exp-08-latency-injection"
    name: "Latency Injection - Lambda getAgendas"
    description: "Agregar 2000ms de latencia artificial"
    priority: "LOW"
    status: "PLANNED"
    
    target:
      type: "lambda"
      function_name: "hospital-boxes-api-dev-getAgendas"
      region: "us-east-1"
    
    attack:
      type: "latency"
      parameters:
        milliseconds: 2000
        duration: 300
    
    cli_command: |
      gremlin attack-lambda latency \
        --function-name hospital-boxes-api-dev-getAgendas \
        --milliseconds 2000 \
        --length 300 \
        --region us-east-1 \
        --team-id $GREMLIN_TEAM_ID
  
  - id: "exp-09-dns-corruption"
    name: "DNS Corruption - Lambda auth"
    description: "Corromper resolución DNS para servicios externos"
    priority: "LOW"
    status: "PLANNED"
    
    target:
      type: "lambda"
      function_name: "hospital-boxes-api-dev-login"
      region: "us-east-1"
    
    attack:
      type: "dns"
      parameters:
        target_domain: "cognito-idp.us-east-1.amazonaws.com"
        duration: 180  # 3 minutos
  
  - id: "exp-10-packet-loss"
    name: "Packet Loss - Lambda DynamoDB calls"
    description: "Simular pérdida de paquetes en comunicación con DynamoDB"
    priority: "LOW"
    status: "PLANNED"
    
    target:
      type: "lambda"
      function_name: "hospital-boxes-api-dev-getBoxes"
      region: "us-east-1"
    
    attack:
      type: "network"
      parameters:
        packet_loss_percent: 30
        duration: 300

# ═══════════════════════════════════════════════════════════════
# CONFIGURACIÓN GLOBAL
# ═══════════════════════════════════════════════════════════════

global_config:
  team_id: "${GREMLIN_TEAM_ID}"
  api_key: "${GREMLIN_API_KEY}"
  api_secret: "${GREMLIN_API_SECRET}"
  
  default_region: "us-east-1"
  
  notification:
    email: "your-email@example.com"
    slack_webhook: ""  # Opcional
  
  safety:
    max_duration_minutes: 10
    auto_stop_on_threshold: true
    require_confirmation: true
  
  reporting:
    auto_generate: true
    export_format: "pdf"
    include_screenshots: true

# ═══════════════════════════════════════════════════════════════
# SCHEDULE (Opcional - No disponible en Free Tier)
