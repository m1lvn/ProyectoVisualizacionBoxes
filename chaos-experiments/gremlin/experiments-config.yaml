# ═══════════════════════════════════════════════════════════════
# NOTAS DE USO
# ═══════════════════════════════════════════════════════════════

# Para ejecutar desde CLI:
#   1. Cargar variables de entorno:
#      source .env.gremlin
#
#   2. Ejecutar experimento específico:
#      gremlin attack-lambda cpu \
#        --function-name hospital-boxes-api-dev-getBoxes \
#        --percent 90 \
#        --length 300
#
#   3. Listar ataques activos:
#      gremlin attacks list
#
#   4. Detener ataque:
#      gremlin attacks halt <attack-id>

# Para usar con Gremlin UI:
#   1. Ir a: https://app.gremlin.com/attacks/new
#   2. Seleccionar target desde UI
#   3. Elegir attack type
#   4. Configurar parámetros
#   5. Run Attack

# Límites Free Tier:
#   - 5 ataques/mes
#   - Max 60 minutos por ataque
#   - 1 usuario
#   - Sin scheduling automático
