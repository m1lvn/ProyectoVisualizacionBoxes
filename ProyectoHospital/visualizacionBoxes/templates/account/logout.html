{% extends 'visualizacionBoxes/base.html' %}

{% block title %}Cerrar Sesión - Hospital{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header bg-warning text-white text-center">
                    <h4><i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión</h4>
                </div>
                <div class="card-body p-4 text-center">
                    <div class="mb-4">
                        <i class="fas fa-question-circle fa-3x text-warning mb-3"></i>
                        <h5>¿Estás seguro que deseas cerrar sesión?</h5>
                        <p class="text-muted">Se cerrará tu sesión actual y tendrás que volver a iniciar sesión.</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                            <button type="submit" class="btn btn-warning me-md-2">
                                <i class="fas fa-sign-out-alt me-2"></i>Sí, Cerrar Sesión
                            </button>
                            <a href="{% url 'visualizacionBoxes:visualizacion_general' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.card {
    border: none;
    border-radius: 10px;
}

.card-header {
    border-radius: 10px 10px 0 0 !important;
    border: none;
    background: linear-gradient(135deg, #ffc107 0%, #e0a800 100%) !important;
}

.btn {
    border-radius: 8px;
    padding: 12px 20px;
    font-weight: 500;
}

.btn-warning {
    background: linear-gradient(135deg, #ffc107 0%, #e0a800 100%);
    border: none;
    color: #000;
}

.btn-secondary {
    background: linear-gradient(135deg, #6c757d 0%, #545b62 100%);
    border: none;
}

.shadow {
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
}
</style>
{% endblock %}
