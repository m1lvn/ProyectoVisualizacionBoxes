{% load visual_pasillo %}
<!-- ============================= -->
<!-- TABLA DE BOXES PASILLO       -->
<!-- ============================= -->
<div class="table-responsive contenedor-tabla">
  <table class="table table-bordered text-center w-100 table-boxes">
    
    <!-- Encabezado -->
    <thead class="table-light sticky-top">
      <tr>
        <th class="celda-hora">
          <i class="fas fa-clock me-1"></i>Hora
        </th>
        {% for box in boxes %}
          <th class="columna-box" data-pasillo="{{ box.pasillo|lower }}" 
              title="Pasillo: {{ box.pasillo }}">
            <div class="box-header">
              <strong>BOX {{ box.idBox }}</strong>
            </div>
          </th>
        {% endfor %}
      </tr>
    </thead>
    
    <!-- Cuerpo de la tabla -->
    <tbody>
      {% for hora in horas_bloque %}
        <tr class="fila-horario" data-hora="{{ hora }}">
          <td class="celda-hora">
            <strong>{{ hora }}</strong>
          </td>
          {% for box in boxes %}
            <td class="time-slot celda-box libre" 
                data-box="{{ box.idBox }}" 
                data-pasillo="{{ box.idPasillo }}"
                data-hora="{{ hora }}"
                data-estado="Disponible"
                title="Box {{ box.idBox }} - {{ hora }}">
              <div class="slot-content">
                <span class="slot-time">{{ hora }}</span>
              </div>
            </td>
          {% endfor %}
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
