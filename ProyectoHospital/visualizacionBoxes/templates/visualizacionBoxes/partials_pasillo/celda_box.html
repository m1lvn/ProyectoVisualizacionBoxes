<!-- ============================= -->
<!-- CELDA INDIVIDUAL DE BOX       -->
<!-- ============================= -->
<td class="time-slot 
     {% if estado == 'Reservado' %}ocupado
     {% elif estado == 'Disponible' %}libre
     {% elif estado == 'Inhabilitado' %}inhabilitado
     {% elif estado == 'En mantención' %}mantencion
     {% elif estado == 'Limpieza' %}limpieza
     {% else %}libre{% endif %}" 
    data-pasillo="{{ box.idpasillo.pasillo|lower }}" 
    data-box="{{ box.idbox }}" 
    data-box-id="{{ box.idbox }}"
    data-codigo-box="{{ box.idbox }}"
    data-hora="{{ hora }}"
    data-estado="{{ estado }}"
    onclick="mostrarDetallePasillo('{{ box.idbox }}', '{{ hora }}')"
    style="cursor: pointer;"
    title="Box {{ box.idbox }} - {{ hora }} - {{ estado }} - Click para ver detalles o agendar">
  
  <!-- Contenido según estado -->
  {% if estado == 'Reservado' %}
    <div class="box-content reservado">
      <i class="fas fa-user-md"></i>
      <small>{{ info }}</small>
    </div>
  {% elif estado == 'Inhabilitado' %}
    <div class="box-content inhabilitado">
      <i class="fas fa-ban"></i>
      <small>Inhabilitado</small>
    </div>
  {% elif estado == 'En mantención' %}
    <div class="box-content mantencion">
      <i class="fas fa-tools"></i>
      <small>Mantención</small>
    </div>
  {% elif estado == 'Limpieza' %}
    <div class="box-content limpieza">
      <i class="fas fa-broom"></i>
      <small>Limpieza</small>
    </div>
  {% else %}
    <div class="box-content disponible">
      <i class="fas fa-check-circle"></i>
    </div>
  {% endif %}
</td>
