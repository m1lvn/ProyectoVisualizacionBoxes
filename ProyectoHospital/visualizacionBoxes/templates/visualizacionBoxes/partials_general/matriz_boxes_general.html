<!-- ============================= -->
<!-- MATRIZ DE BOXES - GENERAL      -->
<!-- ============================= -->
<div class="boxes-grid">
  {% for box in boxes %}
    {% if box.estado_actual == 'disponible' %}
      <div class="box-item disponible" 
           onclick="mostrarDetalle('{{ box.idBox }}', true)" 
           title="Box {{ box.idBox }} - {{ box.pasillo }} - Disponible">
        {{ box.idBox }}
      </div>
    {% else %}
      {% if box.agenda_actual %}
        <div class="box-item tipo-agenda-{{ box.agenda_actual.idTipoAgenda }}" 
             onclick="mostrarDetalle('{{ box.idBox }}', false)" 
             title="Box {{ box.idBox }} - {{ box.pasillo }} - {{ box.agenda_actual.descripcion }}">
          {{ box.idBox }}
        </div>
      {% else %}
        <div class="box-item disponible" 
             onclick="mostrarDetalle('{{ box.idBox }}', true)" 
             title="Box {{ box.idBox }} - {{ box.pasillo }} - Disponible">
          {{ box.idBox }}
        </div>
      {% endif %}
    {% endif %}
  {% endfor %}
</div>
