<!-- ============================= -->
<!-- PANEL DE AGENDAMIENTO LIMPIO  -->
<!-- ============================= -->

<!-- CSS para flechas desplegables personalizadas -->
<style>
  .custom-select {
    position: relative;
    display: inline-block;
    width: 100%;
  }
  
  .custom-select select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6,9 12,15 18,9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 0.7rem center;
    background-size: 1.2em;
    padding-right: 2.5rem;
    color: #495057;
    background-color: #fff;
    border: 1px solid #ced4da;
    border-radius: 0.375rem;
    cursor: pointer;
    transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
  }
  
  .custom-select select:focus {
    border-color: #86b7fe;
    outline: 0;
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
  }
  
  .custom-select select:hover {
    border-color: #86b7fe;
  }
  
  /* Estilos para el contenedor (sin color) - SOBRESCRIBIR visualizacionPasillo.css */
  .panel-agendamiento-container {
    width: auto !important;       /* Ancho automático según contenido */
    max-width: 300px !important;  /* Ancho máximo similar a la leyenda */
    min-width: 250px !important;  /* Ancho mínimo para legibilidad */
    height: auto !important;
    min-height: auto !important;  /* Sobrescribir cualquier min-height */
    max-height: none !important;  /* Sobrescribir max-height del CSS general */
    padding: 0 !important;        /* Sobrescribir padding del CSS general */
    margin: 0 !important;         /* Sobrescribir margin del CSS general */
    margin-bottom: 0 !important;  /* Sobrescribir margin-bottom específico */
    overflow-y: visible !important; /* Sobrescribir overflow del CSS general */
    position: relative !important;  /* Sobrescribir position sticky */
    top: auto !important;         /* Sobrescribir top del CSS general */
    bottom: auto !important;      /* Asegurar que no hay bottom */
    background: transparent !important; /* Sin color de fondo */
  }
  
  /* El panel interno ya tiene las clases correctas de Bootstrap (card bg-dark) */
  }
  
  .panel-header {
    margin: 0 !important;         /* Sobrescribir márgenes negativos */
    padding: 1rem !important;     /* Padding controlado */
  }
  
  .panel-body {
    padding: 1.5rem !important;
    width: 100%;
    margin: 0 !important;
  }
  
  /* Sobrescribir TODOS los estilos que puedan venir del CSS general */
  .panel-agendamiento .card-header {
    margin: 0 !important;
    padding: 1rem !important;
    background: inherit !important;
  }
  
  /* Asegurar que no hay espacios en blanco laterales */
  .panel-agendamiento-container {
    padding: 0 !important;
    margin: 0 !important;
    width: 100% !important;
  }
  
  .form-control, 
  .custom-select select {
    width: 100%;
    font-size: 0.875rem;
  }
  
  .custom-select {
    width: 100%;
  }
  
  .btn {
    width: 100%;
    padding: 0.75rem 1rem;
  }
  
  .mb-3 {
    margin-bottom: 1rem !important;
  }
  
  .form-label {
    margin-bottom: 0.5rem !important;
    font-size: 0.875rem;
  }
  
  /* Ajustes para campos de hora en dos columnas */
  .row .col-6 .form-control {
    width: 100%;
  }
  
  /* Textarea optimizado */
  textarea.form-control {
    width: 100%;
    min-height: 80px;
  }
</style>

<div class="panel-agendamiento-container">
  <!-- Panel de agendamiento con color oscuro -->
  <div class="card bg-dark text-white px-3 py-3 shadow-sm" style="border-radius: 12px;">
    <form id="form-agendamiento" method="post" action="{% url 'visualizacionBoxes:crear_agenda' %}">
      {% csrf_token %}
      
      <!-- Selección de Pasillo -->
      <div class="mb-3">
        <label class="form-label text-white fw-semibold">Pasillo</label>
        <div class="custom-select">
          <select class="form-control form-control-sm" name="pasillo" id="select-pasillo">
            <option value="">Seleccione un pasillo...</option>
            {% for pasillo in pasillos %}
              <option value="{{ pasillo.idpasillo }}">{{ pasillo.pasillo }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      
      <!-- Selección de Box -->
      <div class="mb-3">
        <label class="form-label text-white fw-semibold">Box *</label>
        <div class="custom-select">
          <select class="form-control form-control-sm" name="box" id="select-box" required>
            <option value="">Seleccione un box...</option>
            {% for box in todos_boxes %}
              <option value="{{ box.idbox }}" data-pasillo="{{ box.idpasillo.idpasillo }}">
                {{ box.codigobox }} - {{ box.idpasillo.pasillo }}
              </option>
            {% endfor %}
          </select>
        </div>
      </div>

      <!-- Fecha -->
      <div class="mb-3">
        <label class="form-label text-white fw-semibold">Fecha *</label>
        <input type="date" class="form-control form-control-sm" 
               name="fecha" id="input-fecha" 
               value="{{ fecha|date:'Y-m-d' }}" required>
      </div>
      
      <!-- Horas -->
      <div class="row mb-3">
        <div class="col-6">
          <label class="form-label text-white fw-semibold">Hora inicio *</label>
          <input type="time" class="form-control form-control-sm" 
                 name="hora_inicio" id="input-hora-inicio" required>
        </div>
        <div class="col-6">
          <label class="form-label text-white fw-semibold">Hora término *</label>
          <input type="time" class="form-control form-control-sm" 
                 name="hora_fin" id="input-hora-fin" required>
        </div>
      </div>
      
      <!-- Tipo de Agenda -->
      <div class="mb-3">
        <label class="form-label text-white fw-semibold">Tipo de Agenda *</label>
        <div class="custom-select">
          <select class="form-control form-control-sm" name="tipo_agenda" id="select-tipo-agenda" required>
            <option value="">Seleccione tipo de agenda...</option>
            {% for tipo in tipos_agenda %}
              <option value="{{ tipo.idtipoagenda }}">{{ tipo.tipoagenda }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      
      <!-- Profesional (Opcional) -->
      <div class="mb-3">
        <label class="form-label text-white fw-semibold">Profesional</label>
        <div class="custom-select">
          <select class="form-control form-control-sm" name="profesional" id="select-profesional">
            <option value="">Seleccione un profesional...</option>
            {% for profesional in profesionales %}
              <option value="{{ profesional.idprofesional }}">
                {{ profesional.nombre }} - {{ profesional.idespecialidad.especialidad }}
              </option>
            {% endfor %}
          </select>
        </div>
      </div>
      
      <!-- Observaciones (Opcional) -->
      <div class="mb-3">
        <label class="form-label text-white fw-semibold">Observaciones</label>
        <textarea class="form-control form-control-sm" 
                  name="observaciones" 
                  id="agendamiento-observaciones"
                  rows="3" 
                  placeholder="Comentarios adicionales"></textarea>
      </div>
      
      <!-- Botones -->
      <div class="d-grid">
        <button type="submit" class="btn btn-primary btn-lg fw-bold" id="btn-confirmar-reserva">
          <i class="fas fa-check me-2"></i>Confirmar reserva
        </button>
      </div>
      
      <div class="d-grid mt-2 mb-0">
        <button type="button" class="btn btn-outline-light btn-sm" id="btn-limpiar-form">
          <i class="fas fa-eraser me-2"></i>Limpiar formulario
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Mensajes de resultado -->
<div id="mensajes-agendamiento" class="mt-3"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Configurar formulario AJAX
    const form = document.getElementById('form-agendamiento');
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData(form);
        const submitBtn = document.getElementById('btn-confirmar-reserva');
        const mensajesDiv = document.getElementById('mensajes-agendamiento');
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Procesando...';
        mensajesDiv.innerHTML = '';
        
        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                mensajesDiv.innerHTML = '<div class="alert alert-success alert-dismissible fade show" role="alert"><i class="fas fa-check-circle me-2"></i>' + data.message + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
                form.reset();
                setTodayDate();
                setTimeout(function() {
                    window.location.reload();
                }, 1000);
            } else {
                mensajesDiv.innerHTML = '<div class="alert alert-danger alert-dismissible fade show" role="alert"><i class="fas fa-exclamation-triangle me-2"></i>' + data.error + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
            }
        })
        .catch(error => {
            mensajesDiv.innerHTML = '<div class="alert alert-danger alert-dismissible fade show" role="alert"><i class="fas fa-exclamation-triangle me-2"></i>Error de conexión. Intente nuevamente.<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-check me-2"></i>Confirmar reserva';
        });
    });
    
    // Configurar filtrado de boxes por pasillo
    const pasilloSelect = document.getElementById('select-pasillo');
    const boxSelect = document.getElementById('select-box');
    
    pasilloSelect.addEventListener('change', function() {
        const selectedPasillo = this.value;
        const boxOptions = boxSelect.querySelectorAll('option');
        
        boxOptions.forEach(option => {
            if (option.value === '') {
                option.style.display = 'block';
            } else {
                const boxPasillo = option.getAttribute('data-pasillo');
                option.style.display = (selectedPasillo === '' || boxPasillo === selectedPasillo) ? 'block' : 'none';
            }
        });
        
        boxSelect.value = '';
    });
    
    // Configurar botón limpiar
    document.getElementById('btn-limpiar-form').addEventListener('click', function() {
        form.reset();
        setTodayDate();
    });
    
    // Configurar fecha de hoy por defecto
    function setTodayDate() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById('input-fecha').value = yyyy + '-' + mm + '-' + dd;
    }
    
    setTodayDate();
});
</script>
